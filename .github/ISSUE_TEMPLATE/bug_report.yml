---
name: 🐛 Bug report
description: Create a report to help us improve
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        Before you continue filling out this report, please take a moment to check that your bug has not been [already reported on GitHub][issue search] 🙌

        Remember to redact any sensitive information such as authentication credentials and/or license keys!

        **Note:** If you are seeking community support, please start a new topic in the [NGINX Community forum][forum].

        This repository is the **website** at kubernetes.nginx.org. For bugs in the products it documents, report them on their own repositories: [NGINX Ingress Controller][nic], [NGINX Gateway Fabric][ngf] or [ingress2gateway][i2g].

        [issue search]: https://github.com/nginx/kubernetes.nginx.org/search?q=is%3Aissue&type=issues
        [forum]: https://community.nginx.org
        [nic]: https://github.com/nginx/kubernetes-ingress/issues
        [ngf]: https://github.com/nginx/nginx-gateway-fabric/issues
        [i2g]: https://github.com/kubernetes-sigs/ingress2gateway/issues

  - type: textarea
    id: overview
    attributes:
      label: Bug Overview
      description: A clear and concise overview of the bug.
      placeholder: When I do "X", "Y" happens instead of "Z".
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: When I do "X", I expect "Z" to happen.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce the Bug
      description: Detail the series of steps required to reproduce the bug.
      placeholder: When I run "X" using [...], "X" fails with "Y" error message. If I check the terminal outputs and/or logs, I see the following info.
    validations:
      required: true

  - type: dropdown
    id: page
    attributes:
      label: Which page?
      options:
        - Landing page (kubernetes.nginx.org)
        - Ingress-NGINX migration tool
        - Both / not sure
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Exact URL
      description: Include the `#anchor` — both pages are single-page apps, so the anchor identifies the view you were on.
      placeholder: https://kubernetes.nginx.org/ingress-nginx-migration.html#mappings
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: The layout changes at 900px and 600px, and the site has a light and a dark theme, so these three usually determine whether a visual bug reproduces.
      value: |
        - Browser and version: [e.g. Firefox 141, Safari 18.2]
        - Window width: [e.g. 1440px, or "phone in portrait"]
        - Theme: [light / dark / followed my system]
    validations:
      required: true

  - type: textarea
    id: yaml
    attributes:
      label: Analyzer input
      description: If the bug is in the migration tool's YAML analyzer, paste the input that triggers it. Redact hostnames, secret names and anything else sensitive.
      render: yaml
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
      placeholder: Feel free to add any other context/information/screenshots/etc... that you think might be relevant to this issue in here.
