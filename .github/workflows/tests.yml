name: Tests

on:
  push:
    branches: [main, "preview/**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Design checks, analyzer & wiring tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      # One `node --check` per file, because the flag parses only its first
      # positional argument and silently discards the rest: `node --check
      # good.js broken.js` exits 0. Passing the glob therefore only ever
      # checked assets/js/index.js, and shared.js — which both pages depend
      # on — was never parsed by anything.
      - name: Syntax-check all first-party scripts
        run: |
          for f in assets/js/*.js; do
            echo "checking $f"
            node --check "$f" || exit 1
          done

      # The four design checks, one step each so a failure names itself in the
      # log rather than hiding inside a compound command. None of them can see
      # the rendered page: a green run means nothing is structurally broken,
      # not that the page looks right.
      - name: Check design tokens
        run: python3 .github/scripts/check-tokens.py

      - name: Check colour contrast
        run: python3 .github/scripts/check-contrast.py

      - name: Check every class resolves to a rule
        run: python3 .github/scripts/check-classes.py

      - name: Check every version string agrees
        run: python3 .github/scripts/check-versions.py

      - name: Check the migration analyzer
        run: node .github/scripts/test-analyzer.js

      # Dependency-free suite (node:test) — page↔engine↔module wiring checks,
      # plus per-source analyzer and conversion cases on the branches that ship
      # a second migration tool.
      #
      # The guard matters: `node --test` exits 0 when it finds no test files,
      # so a deleted or renamed .github/test/ turns this step into a green
      # no-op under a name that claims otherwise. That is the same shape as the
      # `node --check` glob bug above, and the incident list in AGENTS.md.
      - name: Run the test suite
        run: |
          if [ -z "$(find .github/test -name '*.test.js' -print -quit 2>/dev/null)" ]; then
            echo "::error::No .github/test/**/*.test.js found — 'node --test' would pass vacuously."
            exit 1
          fi
          node --test .github/test/*.test.js
