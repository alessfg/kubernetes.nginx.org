# Single node is enough: the comparison happens inside the cluster, so there
# are no host ports to map and nothing to spread across nodes.
#
# The node image is pinned so a run is reproducible and a Kubernetes upgrade
# cannot silently change what the pipeline proved. Bump it deliberately.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: nic-migrate-e2e
nodes:
  - role: control-plane
    image: kindest/node:v1.31.4@sha256:2cb39f7295fe7eafee0842b1052a599a4fb0f8bcf3f83d96c7f4864c357c6c30
